<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sky 车 · 无 PC 版</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky 车">
<meta name="theme-color" content="#05070a">
<meta name="robots" content="noindex,nofollow"><!-- 公网上挂着, 但不让搜索引擎收录 -->
<!--
  ==========================================================================
  car.html —— iPhone **完全不经过 PC** 用语音控九号平衡车 (2026-09-21)
  ==========================================================================
  这一页跟 face.html 是**两条独立的链**, 互不影响:

    face.html (现役)      : PC 的 face_server.py 发页面 + PC 跑 ASR/大脑/TTS
    car.html  (本页)      : 页面挂在公开 HTTPS, 手机本地跑 ASR/大脑/TTS + 蓝牙直连车

  --------------------------------------------------------------------------
  为什么要挂公开 HTTPS: getUserMedia / SpeechRecognition / Web Bluetooth 都要
  **安全上下文**。PC 一关, face_server 就没了, 所以这页必须从公网 HTTPS 出。
  ⚠️ **本页源码里没有任何密钥** —— DeepSeek key 存在**本机 localStorage**,
     只活在这台 iPhone 上, 不进 git、不进公网。两种放法:
       · 在「设置」里输入框粘一次; 或
       · 打开 **`.../sky-car/#k=sk-xxx`** —— 用 hash 不用 query(⛔ query 会进
         GitHub Pages 的服务器访问日志, hash 永不外发), 读完立刻 `replaceState`
         抹掉地址栏。这就是"预置进去", 而**公开源码里一个字都没有**。
  --------------------------------------------------------------------------
  依赖 (缺一个都不行):
    1. **beacio** Safari 扩展 —— iOS Safari 本体没有 Web Bluetooth, 靠它补上
       (App Store 免费; 装完 设置→App→Safari→扩展→beacio 打开并允许)
    2. iOS 自带 `webkitSpeechRecognition` (听, 走 Apple 服务器) —— 要联网
    3. iOS 自带 `speechSynthesis` (说, 本地)
  --------------------------------------------------------------------------
  ★★ 三层安全闸 (与 talk.py / carbody.py 完全对齐, 一层都不能少) ★★
     ① **本地急停**: 转写里出现急停词 → 立刻停车, **不问大脑**。
        外加脸上那颗**常驻的红色立体大按钮** —— 一颗凸起来的红色圆钮, 一个字没有,
        形状就是"按下去"的意思。这是最后一道, 比语音可靠。
     ② **钳位**: 速度一律钳在 max_v/max_w = ±地面速度上限(圆盘可调, 10~50%),
        时长钳在 max_step/hold_sec。
        **不信模型给的数**, 只信这里写死的常量。"前进/后退/左转/右转"速度固定取上限。
     ③ **TTL**: 每条运动都有到期时刻, 到点自动归零。再加 12Hz 保活重发
        (车的遥控协议 **~1s 收不到帧就自己停**)。
        ⇒ 页面崩了 / 手机锁屏 / BLE 断了 → 车最多再走 max_hold_sec(10s) 秒;
           连 BLE 都断了 → 车按协议 ~1s 自己停。
  ⚠️⚠️ **绝不让云端 LLM 待在"停"的路径上** —— 一次网络抖动就是一秒失控。
     本页的顺序写死为: 急停词 → 本地词表 → (都不中才) LLM。
  ==========================================================================
-->
<style>
  /* ==========================================================================
     配色: 冷灰蓝 + 一点青光。**只用这一组变量**, 不要再散着写十六进制 ——
     上一版就是每个块各写各的蓝(#16303f/#24506e/#2b5f80/#8fd0ff…),
     整体看着"哪儿都对但不像一套"。层级: 底 → 面板 → 面板亮面, 描边统一 line。
     ========================================================================== */
  :root{
    color-scheme:dark;
    --bg:#070a0f;          /* 页面底 */
    --panel:#0d141c;       /* 面板底(对话/状态/设置) */
    --panel2:#132030;      /* 面板亮面(按钮/取景器框) */
    --line:#1b2c3b;        /* 普通描边 */
    --line2:#2a4759;       /* 亮描边(可点元素) */
    --tx:#c6d8e6;          /* 正文 */
    --dim:#63808f;         /* 次要 */
    --acc:#4fc9f0;         /* 主强调: 青 */
    --acc2:#1d7fa6;        /* 主强调的暗档(按钮渐变下半) */
    --ok:#42dd8b;          /* 已连/在听 */
    --bad:#ff5a52;         /* 错误 */
    --warn:#ffb020;        /* 提醒 */
    --stop:#ff4436;        /* 急停(全页唯一的纯红) */
  }
  /* ⚠️ 显式 border-box。默认的 content-box 会让 height:104px 实际渲染成 122px
     (padding+border 加上去) —— face.html 的嘴巴"老挡住眼睛"就是这个坑, 别再来一次。 */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
            font:15px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;
            -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  /* 竖排 flex: 取景器吃掉所有余量, 其余按内容高度排。
     ⚠️ 别用 vh 硬算高度 —— 手机架在车上时地址栏收放会让 vh 变。 */
  body{display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:8px;
       padding-top:calc(8px + env(safe-area-inset-top,0px));
       padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  h1{font-size:11.5px;margin:0;color:var(--acc);font-weight:600;letter-spacing:.5px;
     flex:0 0 auto;opacity:.85}

  /* ---- 取景器: 架在车上当第一视角 ----
     ⚠️⚠️ **画面往左靠, 右边一整条竖带留给按钮**(用户要求): 手机竖着架在车上,
        iOS 给的就是**竖幅**视频, 所以画面框做成窄的竖长方形贴左边 —— 右边空出来的
        那条竖带正好装"摄像头摇杆 + 速度圆盘"两个控件。
     ⚠️ 用 contain 不是 cover: cover 会把画面裁到预览框的比例, 左右各切一截 ——
        开车第一视角**看到完整视野**比"没有黑边"重要。竖幅流在窄框里 contain
        几乎正好填满, 只剩左右两条细黑边。 */
  /* ⚠️ 2026-09-21 用户「摄像头的页面高度小一点」—— 原来它 flex:1 把余量**全吃光**(844 视口下
     高到 ~482), 太高了。加个上限: 取景器到手 360 就封顶, 剩下的余量让给下面的对话记录。
     ⚠️ 这条一改, **脸(连带眼睛)整条往上走** —— 因为取景器在脸上面, 它矮了下面就整体上移。
        用户"眼睛向上移一点"就是靠这一条达成的(眼睛本来就在 #face 的 flex-start 顶上, 没法再往上)。 */
  /* ⚠️⚠️ 这条 min-height **不是随手写的**, 它 = 右边那一列「刚好装得下」的高度。
     取景器一旦矮过它, `overflow:hidden` 就会把那一列从底下**切掉** —— 切掉的正是急停钮。
     (实测踩过: min-height 还是 110 的时候, 急停钮被裁得一点不剩, 而且因为被裁的盒子
      **点不到**(elementFromPoint 落回 #face), 那颗最要紧的钮是「看不见 + 按不动」。)
     算式: 摇杆 108 + 圆盘 90 + 急停 36 = 234, 再加 4 个 gap(gap:12)48 = **282**, 取 284 剩 2px。
     ⚠️ gap 为什么是 4 个不是 2 个: #rcol 的 ::before/::after 两个弹性空档**也是 flex 子项**,
        照样吃 gap —— 漏算这 24px 就是"明明算够了却还是被切"。
     ⚠️ 宁可让页面往下滚, 也不许把急停钮切掉半个; 「设置」展开时同理(不必再写额外的
        `body:has(details[open])` 兜底了 —— 这条下限已经把那种情形一起管住)。 */
  #preview{position:relative;flex:1 1 auto;min-height:284px;max-height:360px;background:#000;
           border:1px solid var(--line);border-radius:12px;overflow:hidden}
  #preview video{position:absolute;left:0;top:0;width:70%;height:100%;
                 object-fit:contain;display:block;background:#000}
  #pvOff{position:absolute;left:0;top:0;width:70%;bottom:0;display:flex;align-items:center;
         justify-content:center;text-align:center;padding:14px;background:var(--panel);
         color:var(--acc);font-size:13.5px}

  /* ---- 取景器右边那一列: 摄像头摇杆(上) + 速度圆盘(下) ----
     ⚠️ 整列 absolute 贴右, 视频那边靠 left:0 —— 两边各占各的, 谁也不挤谁。
     ⚠️ 宽度得**跟着圆盘走**(60→90): 圆盘比列还宽的话, 取景器那句 overflow:hidden
        会从右边把它切掉一截。
     ⚠️⚠️ **不再用 `justify-content:center` 竖着居中** —— 圆盘一放大, 居中会把整组
        往两边撑: 圆盘往下、摇杆**同时往上**, 而用户只要圆盘往下。
        改用**首尾两个弹性空档**, 上:下 = 2:1 按余量分配 ⇒ 整组压在下半区,
        而且比例是活的, 矮视口自己会收, 不用写死 px。 */
  /* ⚠️ gap 16 → **12**: 这一列现在是三件东西(摇杆 + 圆盘 + 急停), 4 个 gap 一路算下来
     16 的话整列要 298, 取景器装不下就得抬高下限 —— 抬下限 = 眼睛跟着往下走, 得不偿失。
     12 正好让急停钮的触摸热区(往外扩 12px)跟圆盘**刚好相接不重叠**, 一个像素都不抢。 */
  #rcol{position:absolute;right:6px;top:0;bottom:0;width:90px;
        display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
        gap:12px}
  /* ⚠️ 两个空档就是普通 flex 子项, `flex:2` / `flex:1` 把自由度按 2:1 分掉。
     空元素不写 width 的话在竖排里会被压成 0 宽, 无所谓 —— 它只负责占高度。 */
  #rcol::before,#rcol::after{content:"";display:block;flex:0 1 0}
  #rcol::before{flex:2 1 0}   /* 上方留白 = 总余量的 2/3 */
  #rcol::after {flex:1 1 0}   /* 下方留白 = 总余量的 1/3 */

  /* ---- 摄像头摇杆: 纵向三档 (上=前 中=关 下=后), **纯图标无文字** ----
     一列三个格子 + 一个会滑动的"摇杆帽"(#rockThumb)。点哪格, 帽子滑到哪格。
     ⚠️ 帽子是 z-index:1, 三个 .slot 是 z-index:2 且 flex:1 铺满整条 ——
        所以帽子**永远点不到**, 点哪都落到某个 slot 上, 不用额外处理。
     ⚠️ 尺寸(39x108) = 上一版的 1.5 倍 —— 用户说的"加大 50%"就是这条(26x72 → 39x108)。 */
  #camRock{position:relative;flex:0 0 auto;width:39px;height:108px;padding:3px;
           border-radius:19px;
           background:rgba(7,10,15,.72);border:1px solid var(--line2);
           display:flex;flex-direction:column}
  #camRock .slot{flex:1 1 0;position:relative;z-index:2;border:0;padding:0;
                 background:transparent;border-radius:16px;color:var(--dim);
                 display:flex;align-items:center;justify-content:center}
  #camRock .slot svg{width:19px;height:19px;display:block}
  #camRock .slot.sel{color:var(--acc)}
  #rockThumb{position:absolute;left:3px;top:4px;width:30px;height:30px;border-radius:15px;
             z-index:1;transition:transform .18s ease;
             background:linear-gradient(180deg,var(--acc),var(--acc2));
             box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 2px 5px rgba(0,0,0,.6)}

  .row{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .row button{flex:1}
  button{padding:13px 10px;border-radius:11px;border:1px solid var(--line2);
         background:var(--panel2);color:var(--tx);font-size:15px;font-weight:600}
  button:active{background:#1b2d3f}
  button:disabled{opacity:.4}
  button.on{background:#0f3b2a;border-color:#2f7d55;color:#8dffc0}

  /* ---- 脸: 变形金刚那路数的眼睛(角形金属框 + 青辉 + 白色亮核) + 中间的急停钮 ---- */
  /* ⚠️ 高度必须 ≥ 急停钮的 top+height(56+36=92), 否则那个 absolute 的钮会溢出到
     #midRow 上去; 上面那 56px 正好装眼睛(眼高 52)。多出来的几 px 是余量。 */
  /* ⚠️ 2026-09-21 用户「瞳距再宽一些」: gap 是**由瞳距倒推**的 —— 瞳距 = 眼宽 88 + gap。
     92 → **112** 就是瞳距 180 → **200**。
     ⚠️ 上限 = 视口宽 − 左右内边距 − 双眼总宽: 320 视口下是 304 − 176 = **128**(瞳距 216)。
        取 112 留了余量, 320 上仍然排得开。
     ⚠️ 摇杆也跟着这段 gap 走(它居中在两眼之间), 所以它现在的余量从 2px 变成了 12px。
     ⚠️⚠️ `z-index:2` 是给**摇杆那 1/3 溢出**用的, 不加就是白干:
        #face 和 #midRow 都是 `position:relative` 且 z-index:auto ⇒ 按 CSS 2.1 的绘制顺序,
        这两棵子树属于**同一层**、**按树序先后绘制**, #midRow 在后 ⇒ 它的整棵子树
        (包括里面 static 的 #tr 那块**不透明底色**)会**整个盖在 #face 之上**。
        实测(390×844): 摇杆竖直中线从上往下采样 `+2/+10/+20/+30/+40` 命中 stick,
        到 `+50` 就变成 `tr` —— 恰好是溢出起点(46)。也就是说**没有 z-index 时,
        那溢出的 1/3 是被对话面板盖住的, 根本看不见**(而且那一片也点不到摇杆)。
        给 #face 一个正的 z-index ⇒ 它升到"正 z-index"那一层, 整棵子树压过 #midRow。
        ⚠️ 别改成只给 #stick 加 z-index: #face 不是层叠上下文(z-index:auto),
           #stick 的 z-index 会去跟**更外层**的层叠上下文比, 结果更绕、更容易被后人改坏。 */
  #face{flex:0 0 auto;position:relative;z-index:2;height:98px;
        display:flex;justify-content:center;align-items:flex-start;gap:112px}
  /* 角形金属框。两只眼的顶边都**朝鼻子那侧压下来** —— 这一斜就是"坏笑/不屑"的全部来源。
     ⚠️ clip-path 会把 box-shadow 一起裁掉, 所以外投影只能用 filter:drop-shadow(父级那个)。
     ⚠️ 用 polygon 就**不能**再写 border-radius, 两者互相覆盖。 */
  .eye{flex:0 0 auto;width:88px;height:52px;position:relative;
       background:linear-gradient(180deg,#8ea4b6 0%,#3c5470 20%,#152130 58%,#070c12 100%);
       clip-path:polygon(4% 100%,0 34%,30% 0,96% 14%,100% 100%);
       filter:drop-shadow(0 3px 5px rgba(0,0,0,.75));
       animation:blink 11s infinite}
  #eye2{clip-path:polygon(96% 100%,100% 34%,70% 0,4% 14%,0 100%)}   /* 镜像 */
  /* 里头的透镜(这才是"眼睛本体")。⚠️ 角形**梭形** —— 两端都得收成尖角。
     上一版上下两条边都是平的(梯形), 渲染出来就是两块蓝板子, 一点不像眼睛。
     内端(靠鼻子那侧)压得更低, 才跟上面那道斜眉平行 = 一副"没好气"的斜眼。 */
  .glow{position:absolute;left:9%;right:9%;top:16%;bottom:14%;
        clip-path:polygon(2% 34%,34% 12%,68% 20%,98% 56%,66% 88%,30% 84%);
        /* 径向渐变里那两段突变(58%→70%)就是"虹膜环" —— 没有这圈环, 整块就糊成一团光 */
        background:radial-gradient(circle at 52% 45%,
                   #ffffff 0%,#d8f8ff 10%,#5fd9ff 24%,#1a9fd0 42%,
                   #0a5570 58%,#062b3a 70%,#0d4460 76%,#061b26 100%);
        animation:eyeglow 2.6s ease-in-out infinite}
  #eye2 .glow{clip-path:polygon(98% 34%,66% 12%,32% 20%,2% 56%,34% 88%,70% 84%)}
  /* 亮核。**竖条**不是圆点 —— 变形金刚那个"光核"是竖的一条, 圆点就不像了。
     它是独立元素, 因为要自己走一套"眼神"动画, 不能跟眼皮动画挤在同一个元素上。 */
  .pupil{position:absolute;left:50%;top:50%;width:11px;height:25px;margin:-12.5px 0 0 -5.5px;
         border-radius:5px;animation:attitude 11s infinite;
         background:linear-gradient(180deg,#ffffff,#eafcff 38%,#8fe6ff 72%,#2ea8d8);
         box-shadow:0 0 9px 2px rgba(170,245,255,.95), 0 0 20px 6px rgba(60,190,240,.45)}
  /* ⚠️ 错开只能一丁点: blink 那些关键帧是**跳变**的(46%→50% 就压完),
     错 1.3%(实测 -.14s) 会让两只眼在眨眼瞬间高度差一倍 —— 像坏了, 不像调皮。 */
  #eye2 .pupil,#eye2{animation-delay:-.05s}

  /* 眼皮: 眨眼 + 半闭(不情愿)。⚠️ scaleY 会把亮核一起压扁 —— 这正好就是翻白眼要的效果:
     框压成一条细缝 + 里面青光还在 = 变形金刚式的"眯眼不屑"。 */
  @keyframes blink{
    0%,7%,100%{transform:scaleY(1)}
    9%{transform:scaleY(.06)}  12%{transform:scaleY(1)}          /* 眨一下 */
    46%{transform:scaleY(1)}
    50%{transform:scaleY(.22)} 58%{transform:scaleY(1)}          /* 半闭着往上瞟 = 不情愿 */
    86%{transform:scaleY(1)}
    88%{transform:scaleY(.06)} 91%{transform:scaleY(1)}          /* 再眨一下 */
  }
  @keyframes eyeglow{0%,100%{opacity:.72} 50%{opacity:1}}
  /* 眼神: 先斜眼(调皮), 再往上翻(翻白眼), 回正 */
  @keyframes attitude{
    0%,6%,100%{transform:translate(0,0)}
    14%{transform:translate(-14px,1px)}   24%{transform:translate(-14px,1px)}   /* 斜眼一瞥 */
    32%{transform:translate(0,0)}
    42%{transform:translate(8px,-3px)}    46%{transform:translate(8px,-12px)}   /* 往上翻 */
    50%{transform:translate(8px,-12px)}   58%{transform:translate(0,2px)}
    68%{transform:translate(0,0)}
    76%{transform:translate(12px,0)}      82%{transform:translate(12px,0)}      /* 又瞟一眼 */
    90%{transform:translate(0,0)}
  }

  /* 急停 —— 就是个**大红按钮**, 不是鼻子。急停蘑菇头的样子:
     红色顶面(径向渐变偏左上) + 一圈深色护圈(base ring) + 中间一块**白方块**。**没有文字**。
     ⚠️ 白方块是"停止"这个符号本身(录音机/播放器上那个 ■) —— 没有它这颗红钮就只是"一颗红钮",
        有了它一眼就知道是停。它是 ::after, 不是多套一层 span, 就为省一个 DOM 节点。
     ⚠️ 形状 = **上宽下窄的钝角梯形**: 四个角的横半径上小下大, 底边就被"收"窄了。
        实心大蘑菇从斜上方看就是这个样子 —— 上宽下窄 + 底边一窄, 立刻读得出"按下去"。
     ⚠️ 护圈是 box-shadow 的 0 0 0 Npx(spread)描的 —— 它**跟着 border-radius 一起变形**,
        所以描出来的还是一圈同形状的轮廓, 不是个方框。它是"底座", 不是描边。
     ⚠️ 它**常驻在屏幕上**, 不许藏进 <details> —— 出事时手要去摸的就这一个东西。 */
  /* ⚠️ 2026-09-21 用户「刹车按钮放在速度圆盘下面」—— 它从 #face 挪进了取景器右边那一列,
     排在 #dial 底下。**这不是 absolute 了**, 是那一列的第三个 flex 子项(摇杆 108 + 圆盘 90 + 它 36)。
     ⚠️ 热区(::before 往外扩 12px)往上会够到圆盘下沿 —— 列内 gap **12** ⇒ 两边的热区
        正好**相接不重叠**(再小 1px 就抢圆盘的事件了, 所以 #rcol 的 gap 不能小于 12)。 */
  #estop{flex:0 0 auto;position:relative;width:36px;height:36px;
         padding:0;border:0;
         border-radius:10% 10% 34% 34% / 12% 12% 44% 44%;
         background:radial-gradient(ellipse at 38% 24%,#ff9d8e 0%,#ff4436 42%,#c01508 76%,#7a0a03 100%);
         box-shadow:inset 0 2px 1.5px rgba(255,255,255,.46),
                    inset 0 -5px 8px rgba(70,0,0,.62),
                    0 0 0 3px #101a24, 0 0 0 4px var(--line2),
                    0 5px 9px rgba(0,0,0,.65);
         transition:transform .05s linear}
  /* ⚠️ 看着是 36px, 但**触摸热区撑回 60px** —— Apple 的最小可点尺寸是 44pt, 36 差一截;
     这是急停键, 慌了手抖点不中就白搭。热区是透明的, 谁也看不见。
     热区只往外扩到 145..229, 够不到两眼(141/233), 不会抢走任何其它元素的事件。 */
  #estop::before{content:"";position:absolute;left:-12px;right:-12px;top:-12px;bottom:-12px}
  /* 白方块用 px 不用 %: margin 的百分比是按**宽度**解, 一旦哪天这钮不方了就错位 */
  #estop::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;
                margin:-7px 0 0 -7px;border-radius:3px;
                background:linear-gradient(180deg,#ffffff,#dbe6ed);
                box-shadow:0 1px 2px rgba(90,0,0,.6)}
  /* 按下去: 整体下沉 + 内高光收掉 + 外投影变短 —— 这三样一起变才"陷得进去" */
  #estop:active{transform:translateY(2px) scale(.96);
         box-shadow:inset 0 1px 1px rgba(255,255,255,.2),
                    inset 0 5px 9px rgba(60,0,0,.72),
                    0 0 0 3px #101a24, 0 0 0 4px var(--line2),
                    0 2px 4px rgba(0,0,0,.6)}

  /* ---- 摇杆: 长在**鼻子**位置的手动操纵杆(前后 + 左右转) ----
     ⚠️⚠️ 宽度被**双眼之间的空档锁死**: 瞳距 200 − 眼宽 88 = **112px**。
        再宽就压到眼睛(眼睛的 clip-path 底边不收缩, 是满宽的, 蹭上就是"鼻子糊在眼睛上")。
     ⚠️⚠️ 尺寸被用户改过好几轮, 一路是: 88×88(正圆) → 76×92(竖椭圆) → 38×46(小一半)
        → **57×69**(再 +50%, 就是当前这版; 57 = 38×1.5, 69 = 46×1.5)。
        形状靠 `border-radius` 的斜杠写法:
          横半径 50%(=半宽 28.5, 左右两侧都是"整圆的一半", 所以左右缘是光滑的竖向弧)
          竖半径 上 58% / 下 42%(=上弧高 40, 下弧高 29)
        最宽那一点落在**从上往下 58%** 处 ⇒ 上半是个舒展的大圆顶, 下半收得急而窄 = 蛋形。
        ⚠️ 反过来写(上 42 / 下 58)就成"上窄下宽"的倒蛋了, 用户要的是**上宽下窄**。
        ⚠️ 底盘一改大小, **杆头/行程/护圈必须一起按同比例走**, 三处都要动:
           杆头 16 → 24, STICK_RX/RY 10/14 → **15/21**(见下面那段注释), 投影 px ×1.5。
           漏掉任何一处就是"球比盘大"或者"推到边上车还没到底"。
        ⚠️⚠️ 2026-09-21 用户「摇杆下移」—— top 3 → 18 → **60**(当前)。
           18 那版底盘中心 = 52.5, 落在眼睛下缘那条线上(仍全在 #face 里)。
           60 这版是用户要求的「**底座 1/3 盖住对话窗体**」: 底盘下缘**故意溢出 #face**,
           钻进下面 #tr(对话记录面板)的顶部, 溢出量 = 底盘高的 1/3 = 69/3 = **23px**
           (60+69 = 129, 比 #face 的 98 多出 31; #face 底下还有 body 的 8px gap ⇒ 实盖 129−106 = 23)。
           ⚠️⚠️ **60 与视口高度无关**, 推导: #stick 是 #face(position:relative) 的 absolute 子元素,
              而 #face / #midRow 是 body 的直接子元素、中间只有 body 自己的 flex `gap:8px`,
              #tr 又在 #midRow 里 `height:100%` 顶格 ⇒ 相对量恒等于
              **98(#face 高) + 8(body gap) + 23(1/3 底盘高) − 69(底盘高) = 60**。
              换视口时(#preview 在 284~360 之间伸缩)#face 与 #tr **一起平移**, 这个差不变。
              ⚠️ 前提是 #face 高恒 98、body gap 恒 8、#tr 仍顶格 —— 动任一个都要重算。
           ⚠️ 为什么压得住: #face 是 overflow:visible(**不裁**子元素); 且 #stick 是**定位元素**、
              #tr 是 **static** ⇒ 定位元素画在非定位元素之上, 不用 z-index 就盖住了。
           ⚠️ 代价(用户已知情接受): 底盘下 1/3 压在对话面板上, 那一片不再能拖动滚屏 ——
              #stick 带 touch-action:none, 指针事件被它吃掉, 想翻记录得从别处下手。
           ⚠️ 眼睛没被压到: 眼睛是 `align-items:flex-start` 贴着 #face 顶的、高 52
              ⇒ 眼下缘在 #face 内 y=52; 底盘上缘 60 ⇒ **还留 8px**。
     ⚠️ touch-action:none —— 不写的话手指一拖整个页面跟着滚, 杆就抓不住了(同 #dial)。
     ⚠️ 底盘/护圈/球面光的写法与 #dial 逐条一致(径向渐变 + box-shadow spread 描环),
        一眼能看出这俩是同一套控件语言。 */
  #stick{position:absolute;left:50%;top:60px;margin-left:-28.5px;width:57px;height:69px;
         border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;touch-action:none;
         background:radial-gradient(circle at 38% 26%,#4d6f86 0%,#263b4e 34%,#111e2a 66%,#070c12 100%);
         /* ⚠️ 内高光/内阴影/护圈的 px 都**跟着底盘一起缩放**: 88 → 38 时缩了一半,
            38 → 57 时又放大 1.5 倍。不跟着走的话护圈会要么吞掉整个底盘, 要么细得看不见。 */
         box-shadow:inset 0 2px 1.5px rgba(255,255,255,.22),
                    inset 0 -6px 10px rgba(0,0,0,.78),
                    0 0 0 3px #0d141c, 0 0 0 4px var(--line2),
                    0 6px 12px rgba(0,0,0,.7)}
  /* 十字刻度(上=前 下=后 左右=转)。⚠️ 两个伪元素各画一条直线, 不引多余 DOM。
     ⚠️ 用 rgba 的淡蓝而不是纯灰 —— 在深蓝底上灰线会发脏。 */
  #stick::before,#stick::after{content:"";position:absolute;background:rgba(120,170,205,.17)}
  #stick::before{left:50%;top:7px;bottom:7px;width:1px;margin-left:-.5px}
  #stick::after{top:50%;left:7px;right:7px;height:1px;margin-top:-.5px}
  /* 只有杆头这一层会动(同 #dialKnob 的分工: 底盘不动, 让指针走)。
     ⚠️ 用户要**橙色柄**。冷蓝底盘配暖橙杆头, 一眼就能把"杆"从盘面上认出来 ——
        这比原来那颗跟底盘同色系的蓝珠子好读得多(原来推出去要靠影子才看得出偏没偏)。 */
  #stickKnob{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;
             border-radius:50%;pointer-events:none;
             background:radial-gradient(circle at 38% 28%,#ffe6c2 0%,#ff9d24 36%,#b4520a 78%,#3a1a02 100%);
             box-shadow:0 0 7px 1.5px rgba(255,150,40,.55),
                        inset 0 -2px 4.5px rgba(60,20,0,.55), 0 2px 6px rgba(0,0,0,.6);
             transition:transform .09s ease-out}
  /* ⚠️ 手指按着的时候**不许有缓动** —— 有 transition 的话杆头追不上手指, 看着像"拖不动" */
  #stick.drag #stickKnob{transition:none}

  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--dim)}
  /* 车辆状态读数 —— **折叠进最下面那个「设置」里了**(用户要求), 平时不占屏幕。
     它就是几行等宽字, 没有它照样开车; 真要排障才展开看。id 没改, draw() 照旧写它。 */
  #hud{border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin:8px 0 2px;
       background:#0b141d;font:11px/1.6 ui-monospace,Menlo,monospace;
       white-space:pre-wrap;color:var(--tx)}

  /* ---- 地面速度上限: **3D 拨动圆盘** ----
     做成一颗"能拧的实心旋钮", 不是一圈进度条: 盘面用径向渐变做出左上受光、
     右下入鞘的球面感, 外圈靠 box-shadow 的 spread(0 0 0 3px/4px)描出底座护圈
     (⚠️ 用 spread 而不是 border —— spread 会**跟着 border-radius 一起变形**, 圆的自是圆;
        写成 border 再想加个环就得再叠一层元素)。
     中间那根竖条是**指针**, 挂在 #dialKnob 上跟着值一起转; 数值文本是兄弟节点,
     所以字不跟着转(转了就歪了)。
     ⚠️ 不用 conic-gradient / repeating-conic —— Chrome 69+ 才有, 且一旦写进 background
        简写里, 老引擎会**丢掉整条声明**(同 min()/inset 那类坑)。这里全程只用径向渐变。
     ⚠️ touch-action:none 必须写 —— 否则手指一拖, 页面跟着一起滚, 盘就抓不住了。 */
  #dial{flex:0 0 auto;position:relative;width:90px;height:90px;border-radius:50%;
        touch-action:none;
        background:radial-gradient(circle at 36% 26%,
                   #4d6f86 0%,#263b4e 32%,#111e2a 64%,#070c12 100%);
        box-shadow:inset 0 3px 2px rgba(255,255,255,.26),
                   inset 0 -8px 14px rgba(0,0,0,.78),
                   0 0 0 4px #0d141c, 0 0 0 5px var(--line2),
                   0 9px 18px rgba(0,0,0,.7);
        transition:transform .05s linear}
  /* 按下去: 整体下沉 + 内高光收掉 + 外投影变短 —— 三样一起变才"陷得进去"(同急停钮那套) */
  #dial.drag{transform:translateY(1px) scale(.97);
        box-shadow:inset 0 1px 1px rgba(255,255,255,.14),
                   inset 0 5px 10px rgba(0,0,0,.85),
                   0 0 0 3px #0d141c, 0 0 0 4px var(--line2),
                   0 2px 5px rgba(0,0,0,.6)}
  /* 会转的那一层。⚠️ 只是**空壳**, 面本身的受光不能跟着转 —— 转了就成"灯泡在转"了 */
  /* ⚠️ pointer-events:none 是为了让**落点永远是 #dial 自己** —— 不然手指压在指针那根
     竖条上时事件目标是 <i>, setPointerCapture 虽然照样能用, 但语义上别扭。 */
  #dialKnob{position:absolute;left:0;top:0;width:100%;height:100%;
            pointer-events:none;transition:transform .1s ease-out}
  #dialKnob i{position:absolute;left:50%;top:9px;width:6px;height:21px;
              margin-left:-3px;display:block;border-radius:3px;
              background:linear-gradient(180deg,#eafcff,var(--acc) 55%,var(--acc2));
              box-shadow:0 0 10px 2px rgba(79,201,240,.9)}
  #dialVal{position:absolute;left:0;right:0;top:50%;margin-top:-10px;text-align:center;
           font:600 16px/20px ui-monospace,Menlo,monospace;color:var(--acc);
           pointer-events:none;text-shadow:0 0 10px rgba(79,201,240,.6)}
  /* ⚠️ 极矮视口的兜底: 取景器只剩 ~200px 时, 摇杆 108 + 圆盘 90 光这两样就 198,
     再加快档间距必被 `#preview` 的 overflow:hidden 从底下切掉。
     ⚠️ 阈值取 640 是有意的 —— **390×664(Safari 带地址栏的 iPhone 12)必须落在外面**,
        那种视口取景器还有 302px, 90 的圆盘装得下, 不该被缩小。 */
  @media (max-height:640px){
    #dial{width:64px;height:64px}
    #dialKnob i{top:7px;width:5px;height:15px;margin-left:-2.5px;border-radius:2px}
    #dialVal{margin-top:-8px;font:600 12px/16px ui-monospace,Menlo,monospace}
    /* ⚠️ 急停钮现在也住这一列里了 ⇒ 矮视口必须把**整列一起缩小**, 否则它会跟圆盘一起
       被取景器的 overflow:hidden 从底下切掉 —— 这是最不能少的一颗钮。
       算过: (78 + 64 + 32) + 4×12(gap) = **222**px。再配下面那条 min-height 兜底。 */
    #rcol{gap:12px}
    #camRock{height:78px}
    #camRock .slot svg{width:16px;height:16px}
    #rockThumb{left:7px;width:24px;height:24px;border-radius:12px}
    #estop{width:32px;height:32px}
    /* ⚠️ 兜底: 取景器不许矮过整列的高度。只有守住了这条, 急停钮才**永远**看得见 ——
       宁可让页面往下滚, 也不许把它切掉半个。 */
    #preview{min-height:224px}
  }

  /* ---- 中段: 对话记录(整行) + **嵌在对话框里面**的竖排两个立体图标钮 ---- */
  /* ⚠️ flex-grow:1 —— 取景器封顶后腾出来的余量全归它(不这么写页面底部会空一块)。
     高度 158 仍是它的**基准**; 视口矮的时候按 158 排, 高的时候才长。 */
  #midRow{flex:1 1 auto;position:relative;height:158px;min-height:158px}
  /* ⚠️ 高度写死、不随内容长 —— 否则一说起话来它就把上面的取景器越挤越小(实测 342→280px)
     ⚠️ 右边 padding 48px 是留给那两个钮的 —— 不加的话字会钻到按钮底下。 */
  #tr{height:100%;white-space:pre-wrap;word-break:break-word;
      border:1px solid var(--line);border-radius:12px;padding:8px 48px 8px 12px;
      background:var(--panel);overflow-y:auto;font-size:13px}
  #tr .u{color:var(--acc)} #tr .c{color:var(--tx)} #tr .s{color:var(--ok)} #tr .e{color:var(--bad)}

  /* ⚠️ 挂在 #midRow 上(absolute)而不是当 flex 兄弟 —— 这样它**压在对话面板的右边框里侧**,
     看着就是"嵌在对话框里"; 当兄弟排的话中间隔一条间隙, 一眼就看得出是两块东西。
     ⚠️ #midRow 必须 position:relative, 否则它会去找 body 定位。
     ⚠️ 尺寸 = 上一版的一半(62 宽 / 75 高 → 32 宽 / 46 高), 居中排不撑满整列 */
  #acts{position:absolute;right:7px;top:50%;transform:translateY(-50%);
        width:32px;display:flex;flex-direction:column;justify-content:center;gap:7px}
  /* 立体: 上缘一道内高光 + 下缘一道内阴影 + 外投影, 按下去就"陷进去"。
     ⚠️ 别只写 box-shadow —— inset 的高光/暗边才是"凸起来"的关键, 缺一个就是一块平色。 */
  #acts button{flex:0 0 auto;width:32px;height:46px;padding:0;border-radius:11px;
               border:1px solid var(--line2);color:#7fb6d8;
               display:flex;align-items:center;justify-content:center;
               background:linear-gradient(180deg,var(--panel2),#08111a 68%);
               box-shadow:inset 0 1px 0 rgba(255,255,255,.28),
                          inset 0 -3px 6px rgba(0,0,0,.6),
                          0 3px 7px rgba(0,0,0,.55)}
  #acts button svg{width:15px;height:15px;display:block}
  #acts button:active{transform:translateY(2px);
               box-shadow:inset 0 1px 0 rgba(255,255,255,.12),
                          inset 0 3px 8px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5)}
  #acts button.on{color:#8dffc0;border-color:#2f7d55;
               background:linear-gradient(180deg,#1c6242,#05130d 68%);
               box-shadow:inset 0 1px 0 rgba(255,255,255,.32),
                          inset 0 -3px 6px rgba(0,0,0,.55),
                          0 0 12px rgba(66,221,139,.42), 0 3px 7px rgba(0,0,0,.55)}

  details{flex:0 0 auto;border:1px solid var(--line);border-radius:11px;padding:9px 12px;
          background:var(--panel);font-size:12.5px;color:var(--dim)}
  summary{cursor:pointer;color:var(--dim);font-weight:600}
  input[type=password],input[type=text]{width:100%;padding:10px;
        border-radius:9px;border:1px solid var(--line2);background:#0b141d;color:var(--tx);
        font:13px ui-monospace,Menlo,monospace;margin:8px 0}
  label.chk{display:flex;align-items:center;gap:8px;color:var(--dim);margin:6px 0}
</style>
</head>
<body>

<h1>Sky 车 · 无 PC 版</h1>

<div id="preview">
  <video id="pv" playsinline muted autoplay></video>
  <div id="pvOff">点这里开摄像头</div>
  <!-- 右边这一列(竖带): 摄像头摇杆在上, 地面速度圆盘在下。
       画面本身靠左, 这条竖带就是把画面让出来的那块地方。 -->
  <div id="rcol">
  <!-- 三档摇杆: 上=前置(自拍人像) 中=关(镜头划掉) 下=后置(镜头里的风景)。**没有文字**。 -->
  <div id="camRock">
    <div id="rockThumb"></div>
    <button class="slot" data-m="user" aria-label="前置摄像头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round"><circle cx="12" cy="9" r="3.3"/>
        <path d="M6.4 18.6c1.3-2.7 3.3-4 5.6-4s4.3 1.3 5.6 4"/></svg>
    </button>
    <button class="slot" data-m="off" aria-label="关摄像头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9a2 2 0 0 1 2-2h1.7l1.3-2h6l1.3 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <circle cx="12" cy="13" r="3.4"/><path d="M4.2 20 19.8 4"/></svg>
    </button>
    <button class="slot" data-m="environment" aria-label="后置摄像头">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.2"/>
        <path d="M5.4 15.6 9 11.8l2.5 2.5 2.6-3.3 3.2 4.2"/></svg>
    </button>
  </div>
  <!-- 3D 拨动圆盘: 拧它 = 改地面速度上限(10~50%)。#dialKnob 是指针那一层, 跟着值转。 -->
  <div id="dial" aria-label="地面速度上限">
    <div id="dialKnob"><i></i></div>
    <div id="dialVal">12%</div>
  </div>
  <!-- 急停(刹车)。⚠️ 用户要求挂在**速度圆盘下面**, 所以它是这一列的第三个格子。
       ⚠️ 它必须常驻在屏幕上 —— 但挂进 #preview(overflow:hidden) 里有被切的风险, 见
          @media (max-height:640px) 那段兜底(矮视口把整列一起缩小, 保证它不被切掉)。 -->

<!-- 脸: 变形金刚那路数的角形眼(金属框 + 青辉 + 白色亮核) + **两眼正中那根摇杆(鼻子)**。
     ⚠️ 急停钮已经挪走了(用户要求挂在速度圆盘下面), 现在在取景器右边那一列里。 -->

<!-- 对话记录(左, 往上提) + 两个立体图标钮(右, 无文字) -->
<div id="midRow">

  <div id="acts">
    <button id="bCar" aria-label="连车">
      <!-- 蓝牙符文 = "连" -->

<!-- 车辆状态(蓝牙/听/模拟 + v w TTL)**折进「设置」里了**, 平时不占屏幕 ——
     ⚠️ 只有急停钮和速度圆盘是不许藏的: 出事时手要去摸的东西必须在屏幕上。 -->
<details>
  <summary>设置 / 自检</summary>
  <div id="hud">·</div>
  <label class="chk"><input type="checkbox" id="sim" checked> 模拟模式（不发蓝牙，只打印帧）</label>
  <div>DeepSeek key（只存这台手机，不进源码/不进 git）
    <br>也可以用 <b>网址<span class="dim">#k=sk-...</span></b> 打开一次, 自动读入并抹掉地址栏</div>
  <input type="password" id="key" placeholder="sk-...">
  <div class="row" style="margin-top:2px">
    <button id="bSave">保存 key</button>
    <button id="bTest">帧自检</button>
  </div>
  <!-- 后台/自检信息都堆在这里。⚠️ 加 max-height + overflow, 开一整天也不会把设置面板撑爆 -->
  <div id="diag" class="dim"
       style="white-space:pre-wrap;font-size:12px;max-height:150px;overflow-y:auto"></div>
</details>

<script>
"use strict";

/* ========================================================================
   0) 常量 —— 与 ninebot.py / carbody.py / config.json 逐字对齐
   ======================================================================== */
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // 写(我们发指令)
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";   // 通知(车回话, 本页只连不看)

const CAR = {
  /* 第二道闸: 速度上限 %。⚠️ 12 只是**开机默认值**, 圆盘能把它拧到 50(见 2.5 节) */
  max_v: 12, max_w: 12,
  step_sec: 0.8, max_step_sec: 1.5,
  hold_sec: 6,  max_hold_sec: 10,  // max_hold_sec = **失联安全期**
  stop_words: ["停", "停下", "停止", "站住", "别动", "急停", "不许动", "停车"],
};
const KEEP_MS = 80;                // 12.5Hz 保活(协议 ~1s 无帧就自己停, 富余很大)
const LLM_URL = "https://api.deepseek.com/chat/completions";

/* ========================================================================
   1) 帧构建 —— 照抄 ninebot.py
      帧: 0x55 0xAA | L | b1 | b2 | C | data... | ck0 ck1
        L  = len(data)+2 ; ck = (sum(L..data) ^ 0xFFFF), ck0=低字节
   ======================================================================== */
function nbFrame(b1, b2, c, data) {
  data = data || [];
  const body = [data.length + 2, b1, b2, c].concat(data);
  let s = 0;
  for (const b of body) s = (s + b) & 0xFFFF;
  const ck = (s ^ 0xFFFF) & 0xFFFF;
  return new Uint8Array([0x55, 0xAA].concat(body, [ck & 0xFF, (ck >> 8) & 0xFF]));
}
const enterRemote = () => nbFrame(0x0A, 0x03, 0x7A, [0x01, 0x00]);
function driveCmd(v, w) {
  /* data = speed(2, 有符号 LE) + turn(2)
     ⚠️ JS 的 & 作用于 int32, 负数照样取到正确的补码低 16 位(-12 & 0xFFFF = 65524) */
  v = Math.round(v); w = Math.round(w);
  const sp = v & 0xFFFF, tr = w & 0xFFFF;
  return nbFrame(0x0A, 0x03, 0x7B, [sp & 0xFF, (sp >> 8) & 0xFF, tr & 0xFF, (tr >> 8) & 0xFF]);
}
const hex = (u8) => [...u8].map(b => b.toString(16).padStart(2, "0")).join(" ");

/* ========================================================================
   2) UI
   ======================================================================== */
const $ = (id) => document.getElementById(id);
const trEl = $("tr");
function tr(t, cls) {
  const d = document.createElement("div");
  d.className = cls || "c";
  d.textContent = t;
  trEl.appendChild(d);
  while (trEl.childNodes.length > 300) trEl.removeChild(trEl.firstChild);   // 页面可能开一整天, 别让 DOM 无限涨
  trEl.scrollTop = trEl.scrollHeight;
}
/* ---- 后台信息: **不进中间的对话框**, 全走「设置」里那块等宽自检区 ----
   ⚠️ 用户 2026-09-21 要求: 中间的框**只留两类** —— 语音互动(说了啥/回了啥/车动了没)
      和按钮互动(连车/开麦/开关摄像头/拧速度/急停)。协议帧、耗时、定时器到期、
      异常堆栈这些**编程信息**一律挪进设置里。
   ⇒ 判据: 用户**能听见 或 能按到**的 → tr(); 其余 → dbg()。 */
let dbgBuf = [];
function dbgRender() { $("diag").textContent = dbgBuf.join("\n"); }
function dbg(t) {
  dbgBuf.push(String(t));
  while (dbgBuf.length > 300) dbgBuf.shift();
  dbgRender();
}
let hud = {};
function draw() {
  $("hud").textContent =
    `蓝牙 ${hud.ble ? "已连" : "未连"}  听 ${hud.mic ? "开着" : "关着"}  ${hud.sim ? "模拟" : "实发"}\n` +
    `v=${hud.v || 0} w=${hud.w || 0}  TTL ${hud.ttl ? (hud.ttl / 1000).toFixed(1) + "s" : "-"}`;
}

/* ========================================================================
   2.5) 速度上限圆盘
   ⚠️ 这里**不是**"只能往下拧"那一版了 —— 盘子现在能拧到 50%(见下面的风险说明)。
      唯一没变的是: 拧出来的值就是**硬上限**, 闸②的钳位每帧都按它来。
   ======================================================================== */
/* ⚠️⚠️ 10~50 是**用户 2026-09-21 亲自定的档**。上一版是 4~12 —— 也就是和 PC 那条链
   (config.json car.max_v=12 / carbody.py --max-v / CarBLE 内部 ±20%)**逐字对齐**的。
   抬到 50 之后这条"三方对齐"在本页**不再成立**, 是**故意**的:
     · 本页是**无 PC** 那条链, 蓝牙直连车, PC 侧那几个限值根本不在回路上, 谈不上冲突;
     · 真车到底认不认 50% 得**实车试**, 车固件自己还有一层限速, 认不到就只是"拧了没反应"。
   ⇒ 风险落在这里: 这是**人骑在上面的自平衡车**, 50% 是原来 12% 的 4 倍还多。
     第一次上 50 务必**先把车架起来(轮子离地)试**, 别骑着试。
   ⇒ 下限也从 4 抬到 10 —— 从此**没有 4~9% 那种慢速蠕行**了, 场地小的时候会嫌快。 */
const DIAL_MIN = 10, DIAL_MAX = 50;
const DIAL_SWING = 135;               // 指针左右各能转 135° —— 270° 行程, 正下方那 90° 是死区

/* 恢复上次拧到的位置。⚠️ 越界的一律**丢掉不要钳** —— localStorage 是用户能改的,
   里面躺着 999 的话, "钳到上限" 还得多解释一句, 直接当没存过最省事也最安全。
   ⚠️ 改范围时这条**顺带就是迁移逻辑**: 上一版存下的 4~9 现在一律落在区间外被丢掉,
      于是自动退回 CAR.max_v 默认值 —— 不会出现"旧存档把新下限顶穿"的情况。 */
const savedMaxV = parseInt(localStorage.getItem("car_maxv") || "", 10);
if (savedMaxV >= DIAL_MIN && savedMaxV <= DIAL_MAX) CAR.max_v = CAR.max_w = savedMaxV;

/* 拧盘 = 把指针转到对应角度。最小 10% → -135°(指左下), 最大 50% → +135°(指右下)。
   ⚠️ 转角是**从中心算**的: #dialKnob 铺满整颗盘, transform-origin 默认就是它的正中,
      所以直接 rotate 就对, 不用写额外的 origin。 */
function dialDraw() {
  const f = (CAR.max_v - DIAL_MIN) / (DIAL_MAX - DIAL_MIN);
  $("dialKnob").style.transform = "rotate(" + (-DIAL_SWING + 2 * DIAL_SWING * f).toFixed(1) + "deg)";
  $("dialVal").textContent = CAR.max_v + "%";
}
/* 从手指落点算角度: 正上方 = 0°, 顺时针为正。下半圆那 90° 是死区, 折到最近那一端。 */
function dialSet(ev) {
  const r = $("dial").getBoundingClientRect();
  const dx = ev.clientX - (r.left + r.width / 2);
  const dy = ev.clientY - (r.top + r.height / 2);
  let a = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (a > 135) a = 135; else if (a < -135) a = -135;
  const v = Math.max(DIAL_MIN, Math.min(DIAL_MAX,
              Math.round(DIAL_MIN + (a + 135) / 270 * (DIAL_MAX - DIAL_MIN))));
  if (v !== CAR.max_v) {
    /* ⚠️ 转向也一起收 —— 只限前进不限原地打转是很怪的 */
    CAR.max_v = CAR.max_w = v;
    try { localStorage.setItem("car_maxv", String(v)); } catch (e) {}
    tr("地面速度上限 → " + v + "%", "dim");
  }
  dialDraw(); draw();      // 已经在走的命令由 keepTick 每帧重新钳位, 不用在这儿动
}
$("dial").addEventListener("pointerdown", (ev) => {
  $("dial").classList.add("drag");
  try { $("dial").setPointerCapture(ev.pointerId); } catch (e) {}
  dialSet(ev); ev.preventDefault();
});
$("dial").addEventListener("pointermove", (ev) => {
  if ($("dial").classList.contains("drag")) { dialSet(ev); ev.preventDefault(); }
});
$("dial").addEventListener("pointerup", (ev) => {
  $("dial").classList.remove("drag");
  try { $("dial").releasePointerCapture(ev.pointerId); } catch (e) {}
});
$("dial").addEventListener("pointercancel", () => $("dial").classList.remove("drag"));

/* ========================================================================
   3) 蓝牙 —— 连车 + 12Hz 保活
   ======================================================================== */
let dev = null, rxChar = null, writing = false;

function carDrop(why) {
  tr("⚠️ 蓝牙断: " + why, "e");
  rxChar = null;
  if (dev && dev.gatt && dev.gatt.connected) { try { dev.gatt.disconnect(); } catch (e) {} }
  dev = null;
  hud.v = hud.w = 0; hud.ttl = 0; hud.ble = false;
  $("bCar").classList.remove("on");
  draw();
}

async function connectCar() {
  if (!navigator.bluetooth) {
    tr("✗ 没有 navigator.bluetooth —— 先装 beacio 扩展并在 Safari 里允许本网站", "e");
    return;
  }
  try {
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS] }],
      optionalServices: [NUS],
    });
    dev.addEventListener("gattserverdisconnected", () => carDrop("车/系统断开"));
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(NUS);
    rxChar = await svc.getCharacteristic(RX);
    /* 进遥控模式 —— 不发这个, 后面的 drive 帧车不认 */
    await rxChar.writeValueWithoutResponse(enterRemote());
    hud.ble = true; $("bCar").classList.add("on"); draw();
    tr("✓ 已连车 " + (dev.name || dev.id) + " , 已发进遥控模式", "s");
  } catch (e) {
    dbg("连车失败: " + e.name + " — " + e.message);
    tr("✗ 连车失败（" + e.name + "）", "e");
    if (e.name === "NotFoundError")
      tr("  车开机了吗? PC 的 carbody.py 是不是还占着车?", "dim");
  }
}

/* ⚠️ 保活是 12.5Hz —— 模拟模式下**只在命令变化时打印**, 否则一秒钟刷 12 行把记录淹了 */
let simV = null, simW = null;
function writeDrive(v, w) {
  if (hud.sim) {
    if (v !== simV || w !== simW) { simV = v; simW = w; dbg(`[模拟] ${hex(driveCmd(v, w))}`); }
    return;
  }
  if (!rxChar || writing) return;      // 上一帧没写完就丢了重来, 保活宁可丢帧也不排队
  writing = true;
  rxChar.writeValueWithoutResponse(driveCmd(v, w))
    .catch((e) => carDrop("写失败 " + e.name))
    .finally(() => { writing = false; });
}

/* ---- 运动状态: 当前命令 + 到期时刻, 由保活循环持续重发 ---- */
let cmdV = 0, cmdW = 0, cmdEnd = 0;
/* 摇杆的四个状态量。⚠️ 声明放这儿(而不是摇杆那一节里)是有意的 —— keepTick/hardStop 都要用,
   若声明晚于它们的**首次执行**, 就会撞上 let 的暂时性死区(TDZ)直接 ReferenceError。 */
let stickHeld = false, stickV = 0, stickW = 0, stickPtr = null, stickLab = "";

function keepTick() {
  const now = performance.now();
  let v = 0, w = 0;
  /* ⚠️⚠️ 摇杆**按着不动**时不会有 pointermove, 光靠事件续命 320ms 后就 TTL 停车了 ——
     手指还按着车却自己停了, 这是最要命的一种"看着对、其实错"。所以每帧在这里补续。 */
  if (stickHeld && (stickV || stickW)) cmdEnd = now + STICK_TTL;
  if (now < cmdEnd) { v = cmdV; w = cmdW; }
  else if (cmdEnd) { cmdV = cmdW = 0; cmdEnd = 0; dbg("TTL 到 → 自动停"); }   // 定时器到期 = 后台信息
  /* ⚠️ 这里是全页唯一持续发帧的地方, 所以**闸②的钳位放在这儿最靠得住**:
     速度圆盘可以在车正走着的时候被拧小 —— 光在 applyCmd 里钳一次不够,
     那样已经把速度发出去了, 得等这条命令走完才降下来。每一帧都钳一次才是真的"立刻"。 */
  v = Math.max(-CAR.max_v, Math.min(CAR.max_v, v));
  w = Math.max(-CAR.max_w, Math.min(CAR.max_w, w));
  cmdV = v; cmdW = w;
  hud.v = v; hud.w = w; hud.ttl = Math.max(0, cmdEnd - now); draw();
  if (rxChar || hud.sim) writeDrive(v, w);
}
setInterval(keepTick, KEEP_MS);

function hardStop(why) {
  stickReset();                 // ⚠️ 停车必须**连摇杆一起松掉** —— 否则杆还按着, 下一帧又续上了
  cmdV = cmdW = 0; cmdEnd = 0;
  if (rxChar) writeDrive(0, 0);
  if (hud.sim) hud.v = hud.w = 0, draw();
  tr("■ 停 " + (why || ""), "s");
}
const sec = (x, dflt, cap) => {
  const n = Number(x);
  return Math.max(0.1, Math.min(n > 0 ? n : dflt, cap));   // 非数/非正 → 用默认; 一律钳到上限
};

/* 动作 → 中文。⚠️ 只给**人看**的这一层用; 帧里的 v/w 是后台信息, 不进对话框。 */
const CN = { forward: "前进", back: "后退", left: "左转", right: "右转", stop: "停" };
/* 动作 → 嘴上说的那一个词。⚠️ 本地命中时大脑没开口, 得自己吱一声, 否则按了/说了没反馈。 */
const TERSE = { forward: "走", back: "后退", left: "左转", right: "右转", stop: "停了" };

/* 把"动作"落成命令。doWhat: forward|back|left|right|stop */
function applyCmd(doWhat, secs) {
  const now = performance.now();
  if (doWhat === "stop") { hardStop("(口令)"); return "停止"; }
  let v = 0, w = 0;
  /* ⚠️ 单步速度**写死取上限**, 不听调用方给的数 —— 同 talk.py。 */
  if (doWhat === "forward") v = CAR.max_v;
  else if (doWhat === "back") v = -CAR.max_v;
  else if (doWhat === "left") w = CAR.max_w;
  else if (doWhat === "right") w = -CAR.max_w;
  else return "";
  const t = sec(secs, CAR.step_sec, CAR.max_step_sec);
  const cv = Math.max(-CAR.max_v, Math.min(CAR.max_v, v));
  const cw = Math.max(-CAR.max_w, Math.min(CAR.max_w, w));
  cmdV = cv; cmdW = cw; cmdEnd = now + t * 1000;
  return `${doWhat} v=${cv} w=${cw} ${t.toFixed(1)}s`;
}

/* ========================================================================
   3.4) 摇杆 —— 长在"鼻子"位置的**手动操纵杆**(前后 + 左右转)
   ⚠️⚠️ 用户的**角度规则**(原话): "左右转弯的控制需要在往左右偏角大于 15 度的时候发生",
       "在正前正后的 30 度夹角范围内的推动, 都算作向正前或正后运动"。落到实现:
         · 左右偏角 def ≤ TURN_DEAD(15°)  → 转向量**恒为 0**(防止"想直走却拧出去")
         · def 从 15° 线性升到 90°        → 转向量 0 → 满(90° 就是纯横向, 满舵)
         · def ≤ STRAIGHT_CONE(30°)       → **前进/后退速度按满档, 不打折扣**
             ("30° 锥内算正前/正后"多半就是这个意思: 不是让速度乘 cos, 而是给个不打折的锥)
         · 30° → 90°                      → 前进分量线性衰减到 0(纯横向 = 原地转, 不往前走)
   ⚠️ 方向约定**照抄 applyCmd**: v>0 前 / v<0 后 / **w>0 左 / w<0 右**。
      所以杆往右推(θ>0) → w 取**负** = 右转。写反了就是"往右推它往左拧"。
   ⚠️ 摇杆**绕开 applyCmd**: 它是连续量, 不是"走 0.8 秒"那种一次性命令。但它同样受
      闸②(keepTick 每帧钳位)和闸③(TTL)管 —— 这两道是安全底线, 不因为多了一个输入源而松。
   ======================================================================== */
const STICK_DEAD_M  = 0.16;   // 死区: 杆头推不到行程的 16% 就当没推(防手抖)
const TURN_DEAD     = 15;     // 左右偏角 ≤ 15° 不转
const STRAIGHT_CONE = 30;     // 正前/正后 30° 锥内, 前进分量按满档
/* ⚠️⚠️ 底盘从**正圆**改成**竖椭圆**之后, 行程就不是一个数了 —— 横向只剩 20px 的余量,
   竖向有 28px。原来那套"圆半径 + 按距离钳位"横着推会**把杆头戳出底盘边缘**。
   改成**椭圆钳位**: (dx,dy) 各按自己的半径归一化成 k, k>1 时沿径向等比缩回来 ⇒
   杆头永远贴着内椭圆走, 横竖都是"推到头"。顺带 m 也直接用这个 k, 含义更准: m=1 = 推到底。
   ⚠️ 半径的来历(底盘 57×69 / 杆头半径 12): 横 28.5 − 12 = 16.5, 竖 34.5 − 12 = 22.5,
      各**留 1.5px 边**取 15 / 21 —— 不留边的话杆头会在蛋形**收窄的那两端**蹭出底盘
      (蛋不是矩形, 越靠上下两端越窄, 光按"半宽减半径"算是不够的)。
      底盘尺寸一变, 这两个数必须跟着重算, 否则推到头时杆头会戳出去。 */
const STICK_RX      = 15;     // 内椭圆横半径
const STICK_RY      = 21;     // 内椭圆竖半径
const STICK_TTL     = 320;    // 手指停住不动时, 每帧续命多长

const stickEl = $("stick"), knobEl = $("stickKnob");
/* (dx,dy) → 归一化椭圆半径: 0=正中, 1=贴着内椭圆, >1=已经越界 */
function stickK(dx, dy) {
  const ax = dx / STICK_RX, ay = dy / STICK_RY;
  return Math.sqrt(ax * ax + ay * ay);
}
function stickKnobTo(dx, dy) {
  knobEl.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px)";
}
/* 由杆头位移算出 (stickV, stickW); 返回给对话框显示的那句话(没在动就返回 "") */
function stickCalc(dx, dy) {
  const m = Math.min(1, stickK(dx, dy));
  if (m < STICK_DEAD_M) { stickV = stickW = 0; return ""; }
  /* θ: 0°=正上, ±90°=正左右, ±180°=正下 */
  const th  = Math.atan2(dx, -dy) * 180 / Math.PI;
  const def = Math.abs(th) <= 90 ? Math.abs(th) : 180 - Math.abs(th);   // 左右偏角
  const fwd = Math.abs(th) <= 90;
  const tf  = def <= TURN_DEAD ? 0
            : Math.min(1, (def - TURN_DEAD) / (90 - TURN_DEAD));
  const ff  = def <= STRAIGHT_CONE ? 1
            : Math.max(0, 1 - (def - STRAIGHT_CONE) / (90 - STRAIGHT_CONE));
  const ms  = Math.min(1, (m - STICK_DEAD_M) / (1 - STICK_DEAD_M));     // 推得越远越有劲
  stickV = (fwd ? 1 : -1) * CAR.max_v * ff * ms;
  stickW = (th > 0 ? -1 : 1) * CAR.max_w * tf * ms;                     // ⚠️ 见上: w>0 是左转
  if (Math.abs(stickV) < 1 && Math.abs(stickW) < 1) return "";
  /* 给对话框看的那句话。⚠️ 只有**方向档位变了**才打印(见 stickMove), 不然连续量会把记录刷爆 */
  if (Math.abs(stickV) < 1) return stickW > 0 ? "原地左转" : "原地右转";
  return (fwd ? "前进" : "后退") + (tf > 0 ? (stickW > 0 ? " · 左转" : " · 右转") : "");
}
/* 松杆/回中/急停都走这儿。⚠️ why 只在**刚才真的在动**时才打印, 否则原地一戳就刷一行"停"。 */
function stickStop(why) {
  const was = !!stickLab;
  stickLab = ""; stickV = stickW = 0;
  cmdV = cmdW = 0; cmdEnd = 0;
  if (rxChar) writeDrive(0, 0);
  if (hud.sim) hud.v = hud.w = 0, draw();
  if (was) tr("■ 停 (" + why + ")", "s");
}
function stickReset() {
  stickPtr = null; stickHeld = false; stickLab = ""; stickV = stickW = 0;
  stickEl.classList.remove("drag");
  stickKnobTo(0, 0);
}
function stickMove(e) {
  const r = stickEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const k = stickK(dx, dy);
  if (k > 1) { dx /= k; dy /= k; }       // 越界就沿径向等比缩回内椭圆上(见 STICK_RX 那段注释)
  stickKnobTo(dx, dy);
  const lab = stickCalc(dx, dy);
  if (lab) {
    /* ⚠️ 只有**档位变了**才打印。杆是连续量, 每帧都写会把对话框刷爆(60fps = 一秒 60 行)。 */
    if (lab !== stickLab) {
      tr("→ " + lab, "s");
      dbg("摇杆 v=" + stickV.toFixed(1) + " w=" + stickW.toFixed(1));
      stickLab = lab;
    }
    cmdV = stickV; cmdW = stickW; cmdEnd = performance.now() + STICK_TTL;
  } else {
    /* ⚠️ 放在**改 stickLab 之前**调用 —— stickStop 靠旧的 stickLab 判断"刚才是不是真在动" */
    stickStop("摇杆回中");
  }
}
stickEl.addEventListener("pointerdown", (e) => {
  if (stickPtr !== null) return;                 // 只认第一根手指, 第二根一律忽略
  stickPtr = e.pointerId; stickHeld = true; stickLab = "";
  stickEl.classList.add("drag");
  try { stickEl.setPointerCapture(e.pointerId); } catch (err) {}
  stickMove(e);
  e.preventDefault();
});
stickEl.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stickPtr) return;
  stickMove(e);
  e.preventDefault();
});
function stickUp(e) {
  if (e.pointerId !== stickPtr) return;
  stickPtr = null; stickHeld = false;
  stickEl.classList.remove("drag");
  stickKnobTo(0, 0);
  stickStop("摇杆松手");
}
stickEl.addEventListener("pointerup", stickUp);
stickEl.addEventListener("pointercancel", stickUp);
/* ⚠️ 摄像头摇杆的帽子位置是**现量**出来的(offsetTop/offsetHeight), 而它的尺寸在
   `@media (max-height:640px)` 里会变 ⇒ 视口一变必须重算一次, 否则帽子会停在旧格子上。
   ⚠️ iOS Safari 地址栏收放也走这个事件, 顺便一起兜住。 */
window.addEventListener("resize", () => camSeg());

/* ========================================================================
   3.5) 取景器 —— 手机架在车上, 看着画面开(第一视角)
   ⚠️⚠️ iOS 一次只能活**一个**摄像头(WebKit bug 238492, 挂了七八年; bug 264288):
       去请求第二个摄像头的那一刻, 第一个的 track 会被**静默掐死**, 不报错。
       ⇒ 切前/后**必须先 stop 掉旧的**再请求新的, 没有别的写法。
   ⚠️ 绝不能要 audio —— 会跟 SpeechRecognition 抢麦克风。只 video。
   ======================================================================== */
const pv = $("pv");
let camStream = null;
let camWant = "environment";          // 默认后摄(架在车上朝前看)
const camName = () => (camWant === "user" ? "前" : "后");

/* 摇杆: 只有摄像头**真的开着**才停在前/后档, 否则一律停在中间那档「关」。
   所以它必须挂在 camStream 上, 不能挂 camWant —— 失败时 camWant 已经改了,
   停在「后」但画面是关的, 比不亮还容易误判。 */
const CAM_ORDER = ["user", "off", "environment"];    // 上 → 中 → 下
function camSeg() {
  const cur = camStream ? camWant : "off";
  const slots = $("camRock").querySelectorAll(".slot");   // ⚠️ 用 querySelectorAll, children 里混着帽子 div
  let sel = null;
  for (const b of slots) {
    const on = (b.dataset.m === cur);
    b.classList.toggle("sel", on);
    if (on) sel = b;
  }
  /* 帽子滑动: **现量格子位置**再算居中, 不写死像素 —— 这一版把整个摇杆缩了一半,
     写死 42px 那版会直接把帽子滑出轨道。offsetTop/offsetHeight 的 offsetParent
     就是 #camRock(它 position:absolute), 所以量到的就是相对轨道的坐标。 */
  if (sel) {
    const thumb = $("rockThumb");
    const top = sel.offsetTop + (sel.offsetHeight - thumb.offsetHeight) / 2;
    thumb.style.transform = "translateY(" + (top - thumb.offsetTop) + "px)";
  }
}
function camUI(on, msg) {
  $("pvOff").style.display = on ? "none" : "flex";
  if (!on) $("pvOff").textContent = msg || "点这里开摄像头";
  camSeg();
}

/* ⚠️ stop 掉并清空, 不留半死不活的 track */
function stopCam() {
  if (camStream) { for (const t of camStream.getTracks()) t.stop(); camStream = null; }
  pv.srcObject = null;
  camUI(false);
}

async function startCam(want) {
  if (want) camWant = want;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camUI(false, "这个浏览器没有摄像头 API（要 https 或 localhost）");
    return;
  }
  stopCam();                          // ⚠️ 见头部注释: 不先停, iOS 上两个一起死
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: camWant },          // ⚠️ 用 ideal 不用 exact —— exact 在 iOS 上易抛错
               width: { ideal: 1280 }, height: { ideal: 720 },
               frameRate: { ideal: 24, max: 30 } },     // 24fps 够用, 别让它满帧发烫
      audio: false,
    });
    pv.srcObject = camStream;
    camUI(true);
    tr("✓ 摄像头 " + camName() + " 已开", "s");
    /* ⚠️ **不要 await play()**: 它的 Promise 要等**第一帧到达**才 settle,
       流没吐帧时它会一直挂着 ⇒ UI 和日志全卡住(实测就是这么被坑的)。
       track 活着 = 摄像头真的开了, 播不播得出来是另一回事, 分开处理。 */
    pv.play().catch((e) => dbg("⚠️ 预览播放失败: " + e.name + "（track 已开, 只是画面没吐帧）"));
  } catch (e) {
    camStream = null;
    dbg("✗ 摄像头 " + camName() + " 失败: " + e.name + " — " + e.message);
    tr("✗ 开" + camName() + "摄像头失败", "e");
    camUI(false, e.name === "NotAllowedError"
        ? "没给摄像头权限 —— 点这里重试"
        : "点这里重试（" + e.name + "）");
    if (e.name === "NotAllowedError")
      tr("  设置 → Safari → 相机 是不是被关了? 或地址栏左边「ᴀA」里改权限", "dim");
  }
}
/* 摇杆三档 (事件委托, 三个格子共用) */
$("camRock").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const m = b.dataset.m;
  if (m === "off") { stopCam(); tr("摄像头已关", "dim"); }
  else startCam(m);
});
$("pvOff").addEventListener("click", () => startCam());

/* ========================================================================
   4) 本地意图 —— 第一级, 0 延时, 覆盖绝大多数控车命令
   ⚠️ 顺序: **先急停, 再方向**。急停永远优先。
   ⚠️⚠️ talk.py 的 is_stop 是**裸子串**匹配, 「不停」「停车场」会误触发。这里修掉:
      匹配处前一个字是「不」就不算(不停/不要停 = 别停), 另把「停车场」整词摘掉。
   ======================================================================== */
function norm(s) {
  return String(s || "").replace(/[\s，。、,.;:!?！？：；~·「」『』“”"']/g, "");
}
function isStop(text) {
  let t = norm(text);
  if (!t) return false;
  t = t.replace(/停车场/g, "");           // 「停车场」不是让你停
  for (const w of CAR.stop_words) {
    let i = t.indexOf(w);
    while (i >= 0) {
      /* 往前看**两个字**: 「不要停」的「不」隔着一个「要」——
         只看前一个字的话，实测「不要停」会被判成急停。 */
      const prev2 = t.slice(Math.max(0, i - 2), i);
      if (prev2.indexOf("不") < 0) return true;
      i = t.indexOf(w, i + 1);
    }
  }
  return false;
}
/* 长词在前 —— 「左转」必须先于「左」被匹配到 */
const LOCAL = [
  ["前进", "forward"], ["往前", "forward"], ["向前", "forward"], ["前走", "forward"],
  ["出发", "forward"], ["走吧", "forward"], ["过来", "forward"], ["走", "forward"],
  ["后退", "back"], ["往后", "back"], ["向后", "back"], ["倒车", "back"], ["退后", "back"],
  ["左转", "left"], ["往左", "left"], ["向左", "left"], ["左", "left"],
  ["右转", "right"], ["往右", "right"], ["向右", "right"], ["右", "right"],
];
/* ⚠️⚠️ **必须是句首, 或者整句足够短**, 才认作控车意图。
   这一版开始"既能控车又能聊天", 而「我左边有点疼」「往右看那栋楼」这种句子里
   藏着"左/右" —— 裸子串匹配会让人**骑着车转出去**。所以长句一律交给云端判。 */
function localIntent(text) {
  const t = norm(text);
  for (const [k, c] of LOCAL) {
    const i = t.indexOf(k);
    if (i < 0) continue;
    if (i === 0 || t.length <= 4) return c;
  }
  return null;
}

/* ========================================================================
   5) 云端大脑 —— 本地没命中才走。**一次调用同时出"动作"和"回话"两行**
   ⚠️⚠️ 改这一段之前先读这两条铁律:
     ① **急停绝不经过这里** —— "停"由本地词表在 handleText 里 0 延时处理, 云端只是补充。
     ② **只认第 1 行行首那个动作词**(`HEAD_ACT`), 认不出就一律"不动"。
        ⛔ 绝不许拿**整段回话**去扫"前进/左转" —— 一旦扫了, 一句
        「前面那家店停止营业了吧」能把车按停, 而「我们前进的方向是…」**能让车开出去**。
        这是"又要聊天又要控车"这一版最容易出人命的地方。
   ⚠️ `thinking:{type:"disabled"}` 是**必须**的: deepseek-flash 默认开思考,
      实测不关的话 max_tokens 会被 reasoning 吃光, **正文一个字都拿不到**。
   ======================================================================== */
const SYS = [
  "你是装在九号平衡车上的车载语音助手。用户的话可能是让你开车, 也可能只是聊天或提问。",
  "只输出两行, 不要序号、不要 markdown、不要任何解释:",
  "第1行: 一个动作词, 只能是 前进 / 后退 / 左转 / 右转 / 停止 / 无",
  "   · 只有用户**明确让你动**时才写方向词; 聊天、提问、闲聊、问天气、骂你 —— 一律写 无",
  "第2行: 要说给用户听的话, 口语化一到两句, 总长不超过 40 字",
  "   · 第1行是方向词 → 说一句简短确认, 例如「好嘞，往前走」",
  "   · 第1行是 无 → 直接回答用户",
  "⚠️ 车上是真人骑着, 认错动作会让人摔下去 —— 宁可不动, 不可乱动。",
].join("\n");

/* ⚠️ 锚在**整段开头**(`^`)。收多少字都只看行首那几个字, 后文里冒出"前进"不会误判。
   容一点行首的 markdown/引号噪音, 但**绝不放宽到"全文搜索"**。 */
const HEAD_ACT = /^[\s>*_`"'「【\[（(]*(前进|后退|左转|右转|停止|无)/;
const ACTMAP = { "前进": "forward", "后退": "back", "左转": "left", "右转": "right", "停止": "stop" };

/* 把模型的输出切成 {动作词, 要说的话}。认不出动作词 → tok=null(不动), 整段当回话。 */
function splitBrain(acc) {
  const m = HEAD_ACT.exec(acc);
  if (!m) return { tok: null, reply: acc.trim() };
  const after = acc.slice(m[0].length);
  const nl = after.search(/\r?\n/);
  /* 一行写到底(没有换行)时, 把动作词后面的同段文本也当回话 —— 模型偶尔不老实换行 */
  return { tok: m[1], reply: (nl >= 0 ? after.slice(nl + 1) : after).trim() };
}

async function askBrain(text) {
  const key = localStorage.getItem("ds_key") || "";
  if (!key) { tr("(没设 DeepSeek key, 忽略这句)", "dim"); return; }
  const t0 = performance.now();
  try {
    const r = await fetch(LLM_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        /* ⚠️ max_tokens 从 16 抬到 220 —— 现在要吐一整句回话, 16 会把话截断成半截 */
        model: "deepseek-flash", stream: true, temperature: 0, max_tokens: 220,
        thinking: { type: "disabled" },
        messages: [{ role: "system", content: SYS }, { role: "user", content: text }],
      }),
    });
    if (!r.ok) {
      dbg("大脑 HTTP " + r.status + " " + (await r.text()).slice(0, 120));
      tr("✗ 大脑出错，这句没动", "e");
      return;
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let acc = "", buf = "", acted = false, tok = null;
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith("data: ")) continue;
        const p = ln.slice(6).trim();
        if (p === "[DONE]") continue;
        let d; try { d = JSON.parse(p); } catch (e) { continue; }
        const c = (d.choices || [])[0];
        const piece = c && c.delta && c.delta.content;
        if (!piece) continue;
        acc += piece;
        /* ⚠️ 边收边判: 动作词在**第 1 行行首**, 所以一到就能定, 不必等回话写完。
           ⚠️ `doAction(..., true)` 的 true = **先别出声** —— 等回话行收完统一播,
              否则"走"和"好嘞往前走"会连着说两遍。 */
        if (!acted) {
          const m = HEAD_ACT.exec(acc);
          if (m) {
            acted = true; tok = m[1];
            dbg("大脑判定 " + tok + " (往返 " + (performance.now() - t0).toFixed(0) + "ms)");
            if (ACTMAP[tok]) { tr("大脑 → " + tok, "c"); doAction(ACTMAP[tok], true); }
          }
        }
      }
    }
    /* 流可能短到一次都没触发上面的判定(比如整段只有一个字), 这里补一次 */
    const cut = splitBrain(acc);
    if (!acted) {
      tok = cut.tok;
      if (tok && ACTMAP[tok]) { tr("大脑 → " + tok, "c"); doAction(ACTMAP[tok], true); }
    }
    /* 回话行缺了就退化成一句简短的; 动作行缺了 = 不动(安全默认, 已经在 splitBrain 里保证) */
    const speakText = cut.reply || (tok && ACTMAP[tok] ? TERSE[ACTMAP[tok]] : "");
    if (cut.reply) tr("大脑: " + cut.reply, "c");
    else dbg("大脑没给回话行");
    if (speakText) say(speakText);
  } catch (e) {
    dbg("大脑失败: " + e.name + " — " + e.message);
    tr("✗ 大脑连不上，这句没动", "e");
  }
}

/* ========================================================================
   6) 语音: 听 (iPhone 自带) + 说 (iPhone 自带)
   ======================================================================== */
/* quiet=true → 只动嘴以外的事(不说那个短词), 留给调用方统一开口。
   ⚠️ 云端那条路必须 quiet —— 大脑马上要给一整句回话, 再叠一个"走"就是连着说两遍。 */
function doAction(what, quiet) {
  const line = applyCmd(what);
  /* ⚠️ 对话框里只写动作本身。applyCmd 返回的那串里带 v=/w=/秒数, 是后台信息, 进 dbg。 */
  if (line) dbg("命令 " + line);
  if (what) tr("→ " + (CN[what] || what), "s");
  if (!quiet) say(TERSE[what] || "");
}

/* ---- 说 ----
   ⚠️⚠️ 这是"边开麦边说话"最要命的一处: 不掐麦克风, 手机**会把自己刚说的话当用户输入再听一遍**
        → 大脑收到回声 → 又回一句 → 无限循环。所以 speak 前 abort 掉识别, 说完再续上。
   ⚠️ iOS 的 onend **经常不触发**(尤其中文), 必须配看门狗按字数估时间兜底, 否则说完再也听不到。 */
let speaking = false, speakSeq = 0, lastSaid = "";
function say(t) {
  if (!t || !window.speechSynthesis) return;
  const my = ++speakSeq;
  lastSaid = t;
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "zh-CN"; u.rate = 1.1;
    speechSynthesis.cancel();      // ⚠️ 不 cancel 会排队积压, 说一句等三句
    speaking = true;
    if (rec) { try { rec.abort(); } catch (e) {} }
    let done = false;
    const fin = () => {
      if (done || my !== speakSeq) return;      // 被后一句顶掉了 → 这算旧账, 不管
      done = true; speaking = false;
      if (listening) setTimeout(() => { if (listening && !speaking) { try { rec.start(); } catch (e) {} } }, 350);
    };
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, t.length * 260 + 2000);      // 看门狗: 中文 ~260ms/字 + 2s 余量
  } catch (e) { speaking = false; }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

function startMic() {
  if (!SR) { tr("✗ 这个浏览器没有 SpeechRecognition", "e"); return; }
  if (!rec) {
    rec = new SR();
    rec.lang = "zh-CN";
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (!r.isFinal) continue;
        const text = (r[0].transcript || "").trim();
        if (text) handleText(text);
      }
    };
    /* ⚠️ iOS 上识别会因为静音自己结束 —— 只要还开着听, 就重起。
       ⚠️ 但**正在说话时不许重起**(那是我们自己 abort 的, 说完由 say() 的 fin 续上), 否则立刻把回话录进去。 */
    rec.onend = () => { if (listening && !speaking) setTimeout(() => { if (listening && !speaking) { try { rec.start(); } catch (e) {} } }, 250); };
    /* ⚠️ "no-speech" 这类每小时能刷几十条, 全进 dbg; 只有真的没权限才在对话框里说一声 */
    rec.onerror = (e) => {
      dbg("识别错误: " + e.error);
      if (e.error === "not-allowed") {
        listening = false; syncMic();
        tr("✗ 麦克风没权限 —— 设置 → Safari → 麦克风 打开", "e");
      }
    };
  }
  listening = true;
  try { rec.start(); } catch (e) {}
  syncMic();
  say("在听");                 // ⚠️ 顺便解锁 speechSynthesis(需要一次真手势)
  tr("🎤 开始听 (再说一次「停止听」或点按钮关掉)", "dim");
}
function stopMic() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (e) {} }
  syncMic();
  hardStop("(关麦)");          // ⚠️ 关麦必须同时停车
  tr("🎤 关麦 + 停车", "dim");
}
/* ⚠️ 按钮上**不许有文字**(用户要求纯图标) —— 状态一律靠 .on 那个绿光表达 */
function syncMic() { $("bMic").classList.toggle("on", listening); hud.mic = listening; draw(); }

/* ⚠️ 看到和自己刚说的一模一样(或是它的片段) → 那是扬声器漏进麦克风的回声, 不是用户在说话。 */
function echoLike(t) {
  if (!lastSaid) return false;
  const a = norm(t), b = norm(lastSaid);
  if (!a || !b) return false;
  return a === b || (a.length >= 4 && b.indexOf(a) >= 0);
}

/* 急停词命中 → 立刻停, **不问大脑**。
   ⚠️ 顺序写死: 急停 → 本地词表 → (都不中才)大脑。**绝不让大脑待在"停"的路径上**。 */
function handleText(text) {
  if (echoLike(text)) { dbg("忽略(像是听到自己刚说的): " + text); return; }
  tr("你: " + text, "u");
  if (isStop(text)) { tr("★ 急停口令命中 → 直接停", "s"); hardStop("(急停口令)"); return; }
  const local = localIntent(text);
  /* ⚠️ 不再单独报"本地命中" —— 那是哪一层判的, 属后台信息; doAction 那行「→ 前进」已经说明结果。 */
  if (local) { dbg("本地词表命中 → " + local); doAction(local); return; }
  askBrain(text);              // 都不中才走云端(控车 + 聊天同一个入口)
}

/* ========================================================================
   7) 接线
   ======================================================================== */
$("estop").addEventListener("click", () => hardStop("(急停按钮)"));
$("bCar").addEventListener("click", connectCar);
$("bMic").addEventListener("click", () => (listening ? stopMic() : startMic()));
$("bSave").addEventListener("click", () => {
  const v = $("key").value.trim();
  if (!v) { localStorage.removeItem("ds_key"); tr("已清空 key", "dim"); return; }
  localStorage.setItem("ds_key", v);
  $("key").value = "";
  tr("✓ key 已存本机 (localStorage), 不进源码也不出这台手机", "s");
});
$("sim").addEventListener("change", (e) => { hud.sim = e.target.checked; draw(); tr("模拟模式 " + (hud.sim ? "开" : "关"), "dim"); });
$("bTest").addEventListener("click", () => {
  const rows = [
    ["进遥控(0x7A)", enterRemote()],
    ["停 (v=0 w=0)", driveCmd(0, 0)],
    ["前 (v=12 w=0)", driveCmd(12, 0)],
    ["后 (v=-12 w=0)", driveCmd(-12, 0)],
    ["左 (v=0 w=12)", driveCmd(0, 12)],
    ["右 (v=0 w=-12)", driveCmd(0, -12)],
  ];
  let out = "";
  for (const [k, f] of rows) out += k.padEnd(16, " ") + hex(f) + "\n";
  out += "\n急停词自测(应为 停/不停→否/停车场→否):\n";
  for (const s of ["停一下", "往前走", "不要停", "停车场在哪", "别动"])
    out += `  ${s.padEnd(8, " ")} → ${isStop(s) ? "停" : "否"}\n`;
  dbgBuf = out.split("\n");      // 自检是一次性的全量输出, 直接换掉整块缓冲
  while (dbgBuf.length > 300) dbgBuf.shift();
  dbgRender();
  tr("自检已出，见「设置」里", "dim");
});

/* ⚠️ 页面被切走/锁屏 → 必须停车。人看不见车的时候, 车不该还在走。 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hardStop("(页面切走)"); stopMic(); stopCam(); }
});
window.addEventListener("pagehide", () => { hardStop("(页面关闭)"); stopCam(); });

hud.sim = true;                 // 默认模拟! 要先"连车"再手动关掉, 免得误发
hud.ble = false; hud.mic = false; hud.v = hud.w = 0; hud.ttl = 0;

/* ---- 预置 key: 网址后缀 `#k=sk-...` ----
   为什么要这条: 在 iPhone 上往输入框里粘一长串 key 很烦, 而且清一次缓存就没了。
   把 key 挂在**网址的 hash** 上打开一次, 就地存进本机, 以后就再也不用管。
   ⚠️⚠️ 用 **hash 不用 query(?k=)**: hash **永远不会发给服务器** —— GitHub Pages 的
      访问日志、CDN 日志里都不会出现这个 key; `?k=` 会明文进日志。
   ⚠️ 读完**立刻 replaceState 把 hash 抹掉**: 地址栏老挂着一串密钥, 截图/分享/历史
      都会把它带出去。抹掉之后 key 只活在 localStorage 里。
   ⚠️ 公开源码里**一个字都没有** —— 这条通路本身就是"密钥不进公开文件"的解法。
   恢复办法: 再点一次那条带 `#k=` 的链接即可。 */
(function restoreKeyFromHash() {
  const m = /[#&]k=([^&]+)/.exec(location.hash || "");
  if (!m) return;
  let v = "";
  try { v = decodeURIComponent(m[1]).trim(); } catch (e) { v = m[1].trim(); }
  if (!v) return;
  try { localStorage.setItem("ds_key", v); } catch (e) {}
  if (window.history && history.replaceState)
    history.replaceState(null, "", location.pathname + location.search);
  tr("✓ 已从网址读入 DeepSeek key, 存在本机 (地址栏已抹掉)", "s");
})();

dialDraw();                     // 把圆盘画成当前上限(含上面刚恢复的 localStorage 值)
draw();
tr("先装 beacio → 点右侧蓝牙图标连车 → 点麦克风图标开始听。", "dim");
tr("⚠️ 默认是**模拟模式**, 只打印帧不发蓝牙。确认帧对了再取消勾选。", "warn");
if (localStorage.getItem("ds_key"))
  tr("(已存 DeepSeek key —— 现在**控车和聊天都能用**, 直接说就行)", "dim");
else
  tr("(没设 key: 只能听懂「前进/后退/左转/右转/停」这几句, 不能聊天)", "dim");

/* 开页就试着起摄像头(架在车上时省一次点击)。
   ⚠️ iOS 对 getUserMedia 有时认"用户手势" —— 起不来也不报错死, 遮罩会变成可点的重试提示。 */
camUI(false);
startCam();
</script>
